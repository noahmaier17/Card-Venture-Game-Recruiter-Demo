name: Deploy Web Application

on:
  workflow_dispatch: # ?
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest # Instead of windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Debug OIDC claims
        shell: bash
        run: |
          echo "Requesting OIDC token..."
          TOKEN_JSON=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')
          echo "Raw token acquired"

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2 | base64 --decode 2>/dev/null | jq)
          echo "Decoded token payload:"
          echo "$PAYLOAD"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::766766277102:role/GitHubActionsLambdaDeploy
          aws-region: us-east-1
          
      - name: Install project and dependencies
        run: pip install .

      - name: Deploy with Zappa
        run: |
          zappa update dev

      # - name: Run web application deployment script
