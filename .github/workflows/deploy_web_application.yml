name: Deploy Web Application

on:
  workflow_dispatch: # ?
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest # Instead of windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Debug OIDC claims (reliable)
        shell: bash
        run: |
          echo "Requesting OIDC token..."

          TOKEN_JSON=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')
          echo "Raw token acquired"

          python << 'EOF'
          import base64, json

          token = """$TOKEN"""
          payload = token.split('.')[1]

          # Fix padding
          payload += '=' * (-len(payload) % 4)

          decoded = base64.urlsafe_b64decode(payload)
          print("Decoded OIDC token payload:")
          print(json.dumps(json.loads(decoded), indent=2))
          EOF

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::766766277102:role/GitHubActionsLambdaDeploy
          aws-region: us-east-1
          
      - name: Install project and dependencies
        run: pip install .

      - name: Deploy with Zappa
        run: |
          zappa update dev

      # - name: Run web application deployment script
