name: Deploy Web Application

on:
  workflow_dispatch: # ?
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest # Instead of windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          role-to-assume: arn:aws:iam::766766277102:role/GitHubActionsLambdaDeploy
          aws-region: us-east-1
          
      - name: Install project and dependencies
        run: pip install .

      - name: Deploy with Zappa
        run: |
          zappa update dev

      # - name: Run web application deployment script
