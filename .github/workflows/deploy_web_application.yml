name: Deploy Web Application

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::766766277102:role/GitHubActionsLambdaDeploy
          aws-region: us-east-1

      - name: Run web application deployment script
        shell: pwsh
        run: |
          ./scripts/deploy_aws_website.ps1 
