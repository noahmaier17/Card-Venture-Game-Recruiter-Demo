name: Deploy Web Frontend

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - react-frontend

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest # Instead of windows

    steps:
      - name: Runs PyTest
        uses: ./.github/workflows/pytest.yml

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          role-to-assume: arn:aws:iam::766766277102:role/GitHubActionsLambdaDeploy
          aws-region: us-east-1
    
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with: 
            node-version: '24'
    
      - name: Install dependencies
        run: npm ci
        working-directory: web_app/frontend

      - name: Build frontend
        run: npm run build
        working-directory: web_app/frontend
    
      - name: Sync to AWS S3
        run: aws s3 sync dist/ s3://deck-building-card-game-frontend --delete
        working-directory: web_app/frontend

      - name: Invalidate AWS CloudFront cache
        run: |
            aws cloudfront create-invalidation --distribution-id E2DRS88F59FNK2 --paths "/*"