name: Run Pytest

on: 
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install project and dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install .

      - name: Runs PyTest
        run: |
          source venv/bin/activate
          pytest