<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Simulate Cards</title>

    <!-- Styling of Cards -->
    <style>
        html {
          scrollbar-gutter: stable;
        }
        body {
          font-family: "Courier New", monospace;
          background-color: #2b2b2b;
          color: rgb(255, 255, 255);
          padding: 1em;
        }
        .card {
          border-bottom: 1px solid #333;
          margin-bottom: 0.5em;
          color: rgb(255, 255, 255);
          padding-bottom: 0.1em;
          font-size: 1.2em;
        }

        .card-names-line {
          display: flex;
          align-items: center;
          color: rgb(0, 0, 0);
          font-size: 1.2em;
          white-space: pre-wrap;
          gap: 8px;
        }
        .card-name-text {
          font-weight: bold;
        }
        .card-table-text {
          font-size: 0.5em;
          font-style: italic;
          color: gray;
        }

        pre {
          white-space: pre-wrap;
        }
        .checkbox-grid {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 1px;
          margin-bottom: 10px;
          font-size: 1.4em;
        }
        .select-all-buttons {
          margin-bottom: 5px;
        }
        #fraction-of-responses-container {
          margin-bottom: 10px;
        }
      </style>
  </head>

  <body>
    <h1>Simulate Cards</h1>

    <form method="get" action="/cards/view">
      <div>
        <form id="dummy-form" onsubmit="return false;"></form>
        <label for="name-search-card">RegEx Search Card Name:</label>
        <input type="text" id="name-search-box" placeholder="..." form="dumnmy-form" oninput="fetchCardsMatchingText()" autocomplete="off">

        <label for="text-search-card">RegEx Search Card Text:</label>
        <input type="text" id="text-search-box" placeholder="..." form="dumnmy-form" oninput="fetchCardsMatchingText()" autocomplete="off">
      </div>
      <div class="select-all-buttons">
        <button type="button" onclick="randomize()">Randomize Order</button>
      </div>
      <div class="select-all-buttons">
        <button type="button" onclick="toggleAll()">Toggle All</button>
        <button type="button" onclick="selectDinosaurCards()">Toggle Dino Cards</button>
        <button type="button" onclick="selectDinosaurCardsIncludingWip()">Toggle Dino Cards (including WIP Tables)</button>
      </div>

      <div class="checkbox-grid">
        {% for table in all_tables %}
          <label>
            <input type="checkbox" name="tables" value="{{ table }}" onchange="fetchCardsMatchingText()">
            {{ table }}
          </label>
        {% endfor %}
      </div>

    </form>

    <div id="fraction-of-responses-container">
      <strong>Cards displayed:</strong>
      <span id="cards-fraction">0 / 0</span>
    </div>
    <div id="cards-container"></div>

    <div>
      <button type="button" onclick="scrollToTop()">Scroll to Top</button>
    </div>

    <script>
      // We must call an initial fetchCardsMatchingText()
      fetchCardsMatchingText();

      // These scripts are using Jinja2 to get Python-related elements, but after
      // getting access to those variables they call scripts.js functions.
      function selectDinosaurCards() {
        const DINO_TABLES = {{ all_dino_cards|tojson }};
        selectSubsetOfCards(DINO_TABLES);
      }

      function selectDinosaurCardsIncludingWip() {
        const ALL_TABLES = {{ all_dino_cards_including_wip|tojson }};
        selectSubsetOfCards(ALL_TABLES);
      }
    </script>

    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
  </body>
</html>
